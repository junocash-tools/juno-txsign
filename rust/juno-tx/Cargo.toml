[package]
name = "juno_tx"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "juno_tx"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
base64 = "0.22.1"
bech32 = "0.11.0"
bs58 = "0.5.1"
ff = "0.13.1"
f4jumble = "0.1.1"
hex = "0.4.3"
orchard = { version = "0.14.0", features = ["circuit"] }
pasta_curves = "0.5.1"
rand = "0.8.5"
ripemd = "0.1.3"
sapling = { package = "sapling-crypto", version = "0.7.0" }
secp256k1 = "0.29.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.17"
transparent = { package = "zcash_transparent", version = "0.8.0", features = ["transparent-inputs"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = { version = "0.28.0", features = ["transparent-inputs"] }
zcash_protocol = { version = "0.9.0", default-features = false }
zcash_script = "0.4.5"
zip32 = "0.2.1"
zeroize = "1.8.2"

[patch.crates-io]
zcash_protocol = { git = "https://github.com/juno-cash/junocash.git", rev = "786b64fc6c42cc77964565dd7ba81496fa74be81", package = "zcash_protocol" }
